name: product-service

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: product-service
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U product -d product-service']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  product_postgres_data:
