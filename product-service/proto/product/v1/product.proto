syntax = "proto3";

package product.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/hsmt-T/systems-seminar-research2/product-service/gen/product/v1;productv1";

service ProductService {
    rpc GetProduct(GetProductReq) returns (GetProductRes);
}

message Product {
    int64 id = 1;
    int64 owner_id = 2;
    string sku = 3;
    string name = 4;
    int64 price = 5;
    int64 stock = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message GetProductReq {
    int64 id = 1;
}

message GetProductRes {
    Product product = 1;
}
